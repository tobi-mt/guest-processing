name: Bug report
description: Report a reproducible defect or data-integrity risk.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: workspace
    attributes:
      label: Workspace
      options:
        - Guest Dashboard
        - Operations
        - Planning
        - Intake or booking
        - API/database
        - Automation/integration
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What happened?
      description: Describe the observed result without including private guest data or credentials.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: "1. Open…\n2. Select…\n3. Observe…"
    validations:
      required: true
  - type: checkboxes
    id: risk
    attributes:
      label: Risk indicators
      options:
        - label: Data was lost, overwritten, duplicated, or mismatched.
        - label: An email, calendar action, publication, or other side effect occurred.
        - label: Authentication, authorization, privacy, or secret exposure may be involved.
  - type: textarea
    id: environment
    attributes:
      label: Environment and evidence
      description: Branch/commit, browser, time, logs, and redacted screenshots.
    validations:
      required: true
