name: quality

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Syntax and undefined names
        run: |
          python -m compileall -q src tests
          ruff check --select F src tests
          node --check src/guest_database_manager/static/app.js
          node --check src/guest_database_manager/static/operations.js
          node --check src/guest_database_manager/static/performance-utils.js
          node --check src/guest_database_manager/static/planning-sort.js
          node --check src/guest_database_manager/static/planning.js
          node --test tests/planning_sort.test.js
      - name: Full regression suite
        run: pytest -q
      - name: Migration, recovery, worker, calendar, email, and security contracts
        run: >-
          pytest -q tests/test_schema_manager.py tests/test_maintenance.py
          tests/test_outbox.py tests/test_web_security_integration.py
          tests/test_metrics.py tests/test_web_interface.py
