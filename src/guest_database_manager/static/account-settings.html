<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account settings · Mirror Talk</title><style>*{box-sizing:border-box}[hidden]{display:none!important}body{min-height:100vh;margin:0;background:#f4efe6;color:#30271e;font-family:"Avenir Next","Segoe UI",sans-serif}.page{width:min(620px,calc(100% - 2rem));margin:3rem auto}.panel{background:#fffaf2;border:1px solid #ded3c6;border-radius:20px;padding:24px;margin:1rem 0}form,label{display:grid;gap:.7rem}input,button{min-height:44px;border-radius:12px;padding:.6rem .8rem;font:inherit}input{width:100%;border:1px solid #cfc2b3}button{border:0;background:#145a4a;color:#fff;font-weight:700;cursor:pointer}.secondary{background:#e7ded1;color:#30271e}.error{color:#8f2d1f}.secret{display:block;max-width:100%;overflow-wrap:anywhere;background:#f1ede5;padding:.7rem;border-radius:.6rem}</style></head>
<body><main class="page"><a href="/dashboard">Back to dashboard</a><h1>Account settings</h1>
<section class="panel"><h2>Change password</h2><form id="password-form"><label>Current password<input name="current_password" type="password" autocomplete="current-password" required></label><label>New password<input name="new_password" type="password" minlength="12" autocomplete="new-password" required></label><label>Confirm new password<input name="confirmation" type="password" minlength="12" autocomplete="new-password" required></label><button type="submit">Change password</button><p id="password-message" aria-live="polite"></p></form></section>
<section class="panel"><h2>Authenticator app</h2><p id="mfa-status">Checking MFA status…</p><button id="start-mfa" type="button">Set up authenticator</button><div id="mfa-enrollment" hidden><p>Add this setup key to your authenticator app:</p><p><code id="mfa-secret" class="secret"></code></p><p id="mfa-uri" class="secret"></p><label>Six-digit code<input id="mfa-confirm-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></label><button id="confirm-mfa" type="button">Confirm MFA</button></div><form id="disable-mfa-form" hidden><label>Current password<input name="password" type="password" autocomplete="current-password"></label><label>Six-digit code<input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></label><button class="secondary" type="submit">Disable MFA</button></form><p id="mfa-message" aria-live="polite"></p></section>
<section class="panel"><h2>Sessions</h2><p>Sign out every browser currently using this account, including this one.</p><button id="invalidate-sessions" class="secondary" type="button">Sign out everywhere</button><p id="session-message" aria-live="polite"></p></section>
</main><script src="/static/account-settings.js?v=20260927.2" defer></script></body></html>
