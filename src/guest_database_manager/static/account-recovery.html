<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recover account · Mirror Talk</title><style>*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;background:#0d0b11;color:#fff8ef;font-family:"Avenir Next","Segoe UI",sans-serif}.card{width:min(440px,calc(100% - 2rem));background:#18141b;border:1px solid #ffffff1f;border-radius:20px;padding:24px;box-shadow:0 20px 60px #3d28111a}form,label{display:grid;gap:.7rem}input,button{min-height:44px;border-radius:12px;padding:.6rem .8rem;font:inherit}input{border:1px solid #ffffff2e;background:#151219;color:#fff8ef}button{border:0;background:#ff6422;color:#1a0d08;font-weight:800}.error{color:#ff9a8d}</style></head><body><main class="card"><h1>Choose a new password</h1><p>Recovery links work once and expire after 30 minutes.</p><form id="recovery-form"><label>New password<input name="password" type="password" minlength="12" autocomplete="new-password" required></label><label>Confirm password<input name="confirmation" type="password" minlength="12" autocomplete="new-password" required></label><button type="submit">Reset password</button><p id="message" aria-live="polite"></p></form></main><script>const form=document.getElementById("recovery-form"),message=document.getElementById("message");form.addEventListener("submit",async event=>{event.preventDefault();message.className="";if(form.password.value!==form.confirmation.value){message.textContent="Passwords do not match.";message.className="error";return}const token=new URLSearchParams(location.search).get("token")||"";try{const response=await fetch("/api/account-recovery",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,password:form.password.value})});const data=await response.json();if(!response.ok)throw new Error(data.error||"Recovery failed");message.textContent="Password changed. Redirecting to sign in…";setTimeout(()=>location.href="/dashboard-login",900)}catch(error){message.textContent=error.message;message.className="error"}});</script></body></html>
