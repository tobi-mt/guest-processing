<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recover account · Mirror Talk</title><link rel="stylesheet" href="/static/brand-system.css?v=20261018.1"><link rel="stylesheet" href="/static/auth.css?v=20261018.1"></head><body class="auth-centered"><main class="auth-card"><h1>Choose a new password</h1><p>Recovery links work once and expire after 30 minutes.</p><form id="recovery-form"><label>New password<input name="password" type="password" minlength="12" autocomplete="new-password" required></label><label>Confirm password<input name="confirmation" type="password" minlength="12" autocomplete="new-password" required></label><button type="submit">Reset password</button><p id="message" aria-live="polite" class="message"></p></form></main><script>const form=document.getElementById("recovery-form"),message=document.getElementById("message");form.addEventListener("submit",async event=>{event.preventDefault();message.className="message";if(form.password.value!==form.confirmation.value){message.textContent="Passwords do not match.";message.className="message error";return}const token=new URLSearchParams(location.search).get("token")||"";try{const response=await fetch("/api/account-recovery",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,password:form.password.value})});const data=await response.json();if(!response.ok)throw new Error(data.error||"Recovery failed");message.textContent="Password changed. Redirecting to sign in…";setTimeout(()=>location.href="/dashboard-login",900)}catch(error){message.textContent=error.message;message.className="message error"}});</script></body></html>
