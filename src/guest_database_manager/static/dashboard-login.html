<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in · Mirror Talk</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f2ebe2;
        --panel: rgba(255, 250, 243, 0.97);
        --border: rgba(91, 70, 47, 0.14);
        --text: #151719;
        --muted: #69584d;
        --accent: #c43d00;
        --gold: #f27a18;
        --danger: #8f2d1f;
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 8% 0%, rgba(242, 122, 24, 0.24), transparent 28rem),
          radial-gradient(circle at 96% 12%, rgba(21, 23, 25, 0.16), transparent 30rem),
          linear-gradient(180deg, #fffaf3 0%, var(--bg) 100%);
        color: var(--text);
      }

      .card {
        width: min(440px, 100%);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 28px;
        padding: 30px;
        box-shadow: 0 28px 80px rgba(61, 40, 18, 0.13);
        backdrop-filter: blur(14px);
      }

      .login-brand { display:flex; align-items:center; gap:12px; margin-bottom:24px; color:var(--accent); font-weight:800; letter-spacing:.02em; }
      .login-brand img { width:56px; height:56px; padding:4px; border-radius:18px; background:#fffaf2; box-shadow:0 10px 24px rgba(196,61,0,.16); }

      h1 {
        margin: 0 0 6px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.8rem, 6vw, 2.35rem);
        line-height: 1.05;
        letter-spacing: -.025em;
      }

      p {
        margin: 0 0 16px;
        color: var(--muted);
      }

      form {
        display: grid;
        gap: 12px;
      }

      label {
        display: grid;
        gap: 6px;
        font-weight: 600;
      }

      input {
        width: 100%;
        padding: 11px 12px;
        border-radius: 12px;
        border: 1px solid rgba(91, 70, 47, 0.2);
        background: #fff;
        font: inherit;
        background: rgba(255,255,255,.82);
      }

      input:focus { outline:3px solid rgba(242,122,24,.5); outline-offset:2px; border-color:var(--accent); }

      button {
        margin-top: 6px;
        border: 0;
        border-radius: 999px;
        padding: 12px 16px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        box-shadow: 0 12px 28px rgba(196,61,0,.2);
      }

      button:hover:not(:disabled) { background:#9f3100; transform:translateY(-1px); }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .message {
        min-height: 1.4rem;
        margin: 6px 0 0;
        font-size: 0.95rem;
      }

      .message.error {
        color: var(--danger);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="login-brand"><img src="/static/mirror-talk-logo.png" alt="" /><span>Mirror Talk Podcast</span></div>
      <h1>Sign in to Mirror Talk</h1>
      <p>Sign in to access the dashboard, planning, and operations pages.</p>
      <form id="login-form">
        <label>
          Username
          <input id="username" name="username" type="text" autocomplete="username" required />
        </label>
        <label>
          Password
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </label>
        <label id="otp-label" hidden>
          Authentication code
          <input id="otp" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" />
        </label>
        <button id="submit" type="submit">Sign In</button>
        <p id="message" class="message" aria-live="polite"></p>
      </form>
    </main>

    <script>
      const form = document.getElementById("login-form");
      const message = document.getElementById("message");
      const submit = document.getElementById("submit");

      function setMessage(text, tone = "") {
        message.textContent = text;
        message.className = `message ${tone}`.trim();
      }

      function nextPath() {
        const params = new URLSearchParams(window.location.search);
        const value = params.get("next") || "/dashboard";
        return value.startsWith("/") ? value : "/dashboard";
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        submit.disabled = true;
        submit.textContent = "Signing in...";
        setMessage("");

        const payload = {
          username: form.username.value.trim(),
          password: form.password.value,
          otp: form.otp.value.trim(),
          next: nextPath(),
        };

        try {
          const response = await fetch("/api/dashboard/login", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          const data = await response.json();
          if (!response.ok) {
            if (data.mfa_required) {
              document.getElementById("otp-label").hidden = false;
              form.otp.required = true;
              form.otp.focus();
            }
            throw new Error(data.error || "Login failed");
          }

          window.location.href = data.redirect_to || payload.next;
        } catch (error) {
          setMessage(error.message || "Login failed", "error");
        } finally {
          submit.disabled = false;
          submit.textContent = "Sign In";
        }
      });
    </script>
  </body>
</html>
