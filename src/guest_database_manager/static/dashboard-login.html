<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in · Mirror Talk</title>
    <link rel="stylesheet" href="/static/brand-system.css?v=20261018.1" />
    <link rel="stylesheet" href="/static/auth.css?v=20261018.1" />
  </head>
  <body class="auth-centered">
    <main class="auth-card">
      <div class="auth-brand"><img src="/static/mirror-talk-logo.png" alt="" /><span>Mirror Talk Podcast</span></div>
      <h1>Sign in to Mirror Talk</h1>
      <p>Sign in to access the dashboard, planning, and operations pages.</p>
      <form id="login-form">
        <label>
          Username
          <input id="username" name="username" type="text" autocomplete="username" required />
        </label>
        <label>
          Password
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </label>
        <label id="otp-label" hidden>
          Authentication code
          <input id="otp" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" />
        </label>
        <button id="submit" type="submit">Sign In</button>
        <p id="message" class="message" aria-live="polite"></p>
      </form>
    </main>

    <script>
      const form = document.getElementById("login-form");
      const message = document.getElementById("message");
      const submit = document.getElementById("submit");

      function setMessage(text, tone = "") {
        message.textContent = text;
        message.className = `message ${tone}`.trim();
      }

      function nextPath() {
        const params = new URLSearchParams(window.location.search);
        const value = params.get("next") || "/dashboard";
        return value.startsWith("/") ? value : "/dashboard";
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        submit.disabled = true;
        submit.textContent = "Signing in...";
        setMessage("");

        const payload = {
          username: form.username.value.trim(),
          password: form.password.value,
          otp: form.otp.value.trim(),
          next: nextPath(),
        };

        try {
          const response = await fetch("/api/dashboard/login", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          const data = await response.json();
          if (!response.ok) {
            if (data.mfa_required) {
              document.getElementById("otp-label").hidden = false;
              form.otp.required = true;
              form.otp.focus();
            }
            throw new Error(data.error || "Login failed");
          }

          window.location.href = data.redirect_to || payload.next;
        } catch (error) {
          setMessage(error.message || "Login failed", "error");
        } finally {
          submit.disabled = false;
          submit.textContent = "Sign In";
        }
      });
    </script>
  </body>
</html>
